modLoader="javafml" #mandatory

loaderVersion="${loader_version_range}" #mandatory

license="${mod_license}"

issueTrackerURL="https://github.com/Antop90fr1/AdvancedWeather1.21.1/issues"

[[mods]] #mandatory
modId="${mod_id}" #mandatory
version="${mod_version}" #mandatory
displayName="${mod_name}" #mandatory
# Must sit inside [[mods]]: the loader reads it per mod, and ignores it at the top of the file.
enumExtensions="META-INF/enumextensions.json"

updateJSONURL="https://api.modrinth.com/updates/advanced-weather/forge_updates.json?neoforge=only"

displayURL="https://modrinth.com/mod/advanced-weather"

logoFile="advancedweather_logo.png"

#credits="" #optional

authors="Antopfr"

description='''
Adds lots of vanilla-friendly weather types and an entire atmospheric system, for all dimensions!
'''

[[mixins]]
config = "advancedweather.mixins.json"

#[[accessTransformers]]
#file="META-INF/accesstransformer.cfg"

[[dependencies.${mod_id}]] #optional
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId = "yet_another_config_lib_v3"
    type = "required"
    versionRange = "[3.6,)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "sereneseasons"
    type = "optional"
    versionRange = "[*,)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId="create"
    type="optional"
    versionRange="[6.0.10,6.1.0)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="sable"
    type="optional"
    versionRange="[*,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="cold_sweat"
    type="optional"
    versionRange="[*,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="particlerain"
    type="optional"
    versionRange="[*,)"
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="atmospherics"
    type="optional"
    versionRange="[*,)"
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="eclipticseasons"
    type="optional"
    versionRange="[*,)"
    ordering="NONE"
    side="BOTH"

# Features are specific properties of the game environment, that you may want to declare you require. This example declares
# that your mod requires GL version 3.2 or higher. Other features will be added. They are side aware so declaring this won't
# stop your mod loading on the server for example.
#[features.${mod_id}]
#openGLVersion="[3.2,)"
